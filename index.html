<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner Gudang Rajawali</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ZXing Library -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="container mx-auto max-w-md p-4 min-h-screen flex flex-col justify-between">
        
        <!-- Header -->
        <div class="bg-blue-600 text-white p-4 rounded-xl shadow-md mb-4 text-center">
            <h1 class="text-xl font-bold">QR Scanner Gudang Rajawali</h1>
            <marquee><p class="text-sm text-blue-100">Tekstil Inventory System</p></marquee>
        </div>

        <!-- Form Input No SO -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="noSo">
                Nomor SO (Sales Order)
            </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" 
                   id="noSo" type="text" placeholder="Masukkan No SO dulu ganteng..." oninput="saveDataState()">
        </div>

        <!-- Area Kamera Scanner -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-4 relative">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-bold text-gray-700">Kamera QR Scanner</span>
                <button id="btnToggleCamera" class="bg-green-500 hover:bg-green-600 text-white text-xs px-3 py-1 rounded font-semibold transition">
                    Mulai Kamera
                </button>
            </div>
            
            <div id="scanner-container" class="relative overflow-hidden rounded-lg bg-black h-52 flex items-center justify-center mb-3">
                <video id="video" class="w-full h-full object-cover"></video>
                <div id="camera-placeholder" class="absolute text-white text-sm text-center p-4">
                    Kamera mati. Klik "Mulai Kamera" untuk scan QR.
                </div>
            </div>

            <!-- Input Cadangan: Ketik Manual / Scanner Fisik -->
            <div class="flex gap-2">
                <input type="text" id="manualInput" placeholder="Ketik / Scan fisik di sini..." 
                       class="shadow-sm border rounded flex-grow py-1.5 px-3 text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                       onkeypress="handleManualInput(event)">
                <button onclick="addManualBarcode()" class="bg-blue-500 hover:bg-blue-600 text-white text-xs px-3 py-1.5 rounded font-semibold transition">
                    Tambah
                </button>
            </div>
        </div>

        <!-- Daftar Barcode yang Terkumpul -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-4 flex-grow">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-bold text-gray-700">QR Ter-scan (<span id="countScan">0</span>)</span>
                <button onclick="clearScans()" class="text-red-500 text-xs hover:underline">Reset Semua</button>
            </div>
            
            <div class="overflow-y-auto max-h-40 border rounded border-gray-200">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 text-xs text-gray-600 sticky top-1">
                        <tr>
                            <th class="p-2 border-b">No</th>
                            <th class="p-2 border-b">Data QR Code</th>
                            <th class="p-2 border-b text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="scanTableBody" class="text-xs text-gray-700">
                        <tr>
                            <td colspan="3" class="p-4 text-center text-gray-400">Belum ada QR code yang di-scan</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tombol Aksi (Salin & Kirim WhatsApp) -->
        <div class="space-y-2 mb-2">
            <button onclick="copyToClipboard()" class="w-full bg-gray-700 hover:bg-gray-800 text-white font-bold py-2.5 px-4 rounded-xl shadow transition flex items-center justify-center space-x-2 text-sm">
                <span>Salin Semua Barcode</span>
            </button>
            <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center space-x-2">
                <span>Kirim ke WhatsApp Admin</span>
            </button>
        </div>

    </div>

    <!-- Script Logika Program -->
    <script>
        let codeReader = null;
        let scannedData = [];
        let isScanning = false;

        const btnToggleCamera = document.getElementById('btnToggleCamera');
        const videoElement = document.getElementById('video');
        const cameraPlaceholder = document.getElementById('camera-placeholder');

        window.addEventListener('DOMContentLoaded', () => {
            const savedSo = localStorage.getItem('gudang_no_so');
            const savedScans = localStorage.getItem('gudang_scanned_data');

            if (savedSo) {
                document.getElementById('noSo').value = savedSo;
            }
            if (savedScans) {
                scannedData = JSON.parse(savedScans);
                updateTable();
            }
        });

        function saveDataState() {
            const noSo = document.getElementById('noSo').value.trim();
            localStorage.setItem('gudang_no_so', noSo);
            localStorage.setItem('gudang_scanned_data', JSON.stringify(scannedData));
        }

        // Suara Beep Normal (Sukses)
        function playSuccessBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio dibatasi browser");
            }
        }

        // Suara Beep Peringatan Duplikat (Nada ganda lebih tinggi)
        function playDuplicateAlert() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                oscillator.frequency.setValueAtTime(300, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.25);
            } catch (e) {
                console.log("Audio dibatasi browser");
            }
        }

        btnToggleCamera.addEventListener('click', () => {
            const noSo = document.getElementById('noSo').value.trim();
            if (!noSo) {
                alert('Harap isi Nomor SO terlebih dahulu sebelum menyalakan kamera!');
                document.getElementById('noSo').focus();
                return;
            }

            if (!isScanning) {
                startScanner();
            } else {
                stopScanner();
            }
        });

        function startScanner() {
            codeReader = new ZXing.BrowserQRCodeReader();
            cameraPlaceholder.style.display = 'none';
            isScanning = true;
            btnToggleCamera.textContent = 'Matikan Kamera';
            btnToggleCamera.classList.replace('bg-green-500', 'bg-red-500');
            btnToggleCamera.classList.replace('hover:bg-green-600', 'hover:bg-red-600');

            codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                if (result) {
                    processScannedCode(result.text);
                }
                if (err && !(err instanceof ZXing.NotFoundException)) {
                    console.error(err);
                }
            }).catch(err => {
                console.error(err);
                alert('Gagal mengakses kamera. Tersedia opsi input manual di bawah.');
                stopScanner();
            });
        }

        function stopScanner() {
            if (codeReader) {
                codeReader.reset();
            }
            isScanning = false;
            cameraPlaceholder.style.display = 'block';
            btnToggleCamera.textContent = 'Mulai Kamera';
            btnToggleCamera.classList.replace('bg-red-500', 'bg-green-500');
            btnToggleCamera.classList.replace('hover:bg-red-600', 'hover:bg-green-600');
        }

        // Proses kode yang masuk (Cek duplikat tanpa pop-up mengganggu)
        function processScannedCode(code) {
            code = code.trim();
            if (!code) return;

            if (scannedData.includes(code)) {
                // Peringatan non-blocking: Getar dua kali & suara khusus duplikat
                playDuplicateAlert();
                if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100]);
                }
                return; 
            }

            // Jika baru: Masukkan ke data & respons sukses
            scannedData.push(code);
            updateTable();
            saveDataState();

            playSuccessBeep();
            if (navigator.vibrate) {
                navigator.vibrate(100);
            }
        }

        function handleManualInput(event) {
            if (event.key === 'Enter') {
                addManualBarcode();
            }
        }

        function addManualBarcode() {
            const inputField = document.getElementById('manualInput');
            const code = inputField.value.trim();
            
            if (!code) return;

            processScannedCode(code);
            
            inputField.value = '';
            inputField.focus();
        }

        function removeScan(index) {
            scannedData.splice(index, 1);
            updateTable();
            saveDataState();
        }

        function clearScans() {
            if (confirm('Yakin ingin menghapus semua daftar scan?')) {
                scannedData = [];
                updateTable();
                localStorage.removeItem('gudang_scanned_data');
            }
        }

        function updateTable() {
            const tbody = document.getElementById('scanTableBody');
            const countScan = document.getElementById('countScan');
            
            countScan.textContent = scannedData.length;
            tbody.innerHTML = '';

            if (scannedData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-400">Belum ada QR code yang di-scan</td></tr>`;
                return;
            }

            scannedData.forEach((item, index) => {
                const row = document.createElement('tr');
                row.className = 'border-b hover:bg-gray-50';
                row.innerHTML = `
                    <td class="p-2">${index + 1}</td>
                    <td class="p-2 font-mono font-semibold">${item}</td>
                    <td class="p-2 text-center">
                        <button onclick="removeScan(${index})" class="text-red-500 hover:text-red-700 font-bold">Hapus</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Fungsi Salin Teks ke Clipboard
        function copyToClipboard() {
            const noSo = document.getElementById('noSo').value.trim();

            if (!noSo) {
                alert('Nomor SO masih kosong!');
                document.getElementById('noSo').focus();
                return;
            }

            if (scannedData.length === 0) {
                alert('Belum ada data QR code yang di-scan!');
                return;
            }

            let textToCopy = `No. SO: ${noSo}\n`;
            scannedData.forEach((code) => {
                textToCopy += `${code}\n`;
            });

            navigator.clipboard.writeText(textToCopy.trim()).then(() => {
                alert('Berhasil disalin ke clipboard! Bisa langsung di-paste ke Excel atau Notepad.');
            }).catch(err => {
                alert('Gagal menyalin teks.');
            });
        }

        function sendToWhatsApp() {
            const noSo = document.getElementById('noSo').value.trim();

            if (!noSo) {
                alert('Nomor SO masih kosong!');
                document.getElementById('noSo').focus();
                return;
            }

            if (scannedData.length === 0) {
                alert('Belum ada data QR code yang di-scan!');
                return;
            }

            let message = `No. SO: ${noSo}\n`;
            scannedData.forEach((code) => {
                message += `${code}\n`;
            });

            const encodedMessage = encodeURIComponent(message.trim());
            const phoneTarget = '628158830450';
            const whatsappUrl = `https://wa.me/${phoneTarget}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
